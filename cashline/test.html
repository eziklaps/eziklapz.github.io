<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cashline test product</title>
  <meta name="description" content="Dummy product page that fires a Cashline purchase.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230ca30c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;
  --muted:#898781;--hairline:#e1e0d9;--ring:rgba(11,11,11,.10);
  --accent:#2a78d6;--accent-ink:#fff;--good:#0ca30c;--good-text:#006300;
  --serif:'Lora',Georgia,serif;--sans:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink-2:#c3c2b7;
    --muted:#898781;--hairline:#2c2c2a;--ring:rgba(255,255,255,.10);
    --accent:#3987e5;--good-text:#0ca30c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
nav.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.wordmark{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:17px}
.wordmark:hover{text-decoration:none;color:var(--accent)}
.navlive{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font:500 14px var(--sans)}
.navlive:hover{color:var(--ink);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font:500 15px var(--sans);border:1px solid var(--ring);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hairline)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px 20px}
footer.site{border-top:1px solid var(--hairline);padding:20px 0 36px;color:var(--muted);font-size:13px;margin-top:56px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input,select{font:500 15px var(--sans);color:var(--ink);background:var(--page);border:1px solid var(--hairline);border-radius:8px;padding:9px 11px;width:100%}

.prod{max-width:480px;margin:56px auto 80px}
.prod h1{font-size:2rem;margin:0 0 8px}
.prod .sub{color:var(--ink-2);margin:0 0 22px}
.amt{font-size:2.2rem;font-weight:650;letter-spacing:-.02em;margin:0 0 18px}
.ok{margin-top:16px;color:var(--good-text);font-size:14.5px}

  </style>
</head>
<body>
  <nav class="top" aria-label="Site"><div class="wrap">
    <a class="wordmark" href="/">Andrew Walsh</a>
    <a class="navlive" href="/Search2/app/"><span class="dot" aria-hidden="true"></span>Live</a>
  </div></nav>
  <div class="wrap">
    <article class="card prod">
      <p class="kicker" style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px">Test store</p>
      <h1>Cashline test item</h1>
      <p class="sub">Dummy product. The $9 button records a pageview and a purchase in this browser so the dashboard can move.</p>
      <p class="amt">$9</p>
      <button class="btn" type="button" id="buy">Buy test</button>
      <p class="ok" id="ok" hidden>Recorded $9 USD. <a href="/cashline/app/">Open the dashboard</a> — example rows drop once real events exist.</p>
    </article>
  </div>
  <footer class="site"><div class="wrap">Not a real store. No charge is made.</div></footer>
  <script>
  (function(){
    var sid = new URLSearchParams(location.search).get("sid") || localStorage.getItem("cashline_sid") || "demo";
    var s = document.createElement("script");
    s.src = "/cashline/snippet.js?sid=" + encodeURIComponent(sid);
    s.setAttribute("data-sid", sid);
    s.onload = function(){
      document.getElementById("buy").addEventListener("click", function(){
        if (!window.cashline) return;
        cashline("pageview");
        cashline("purchase", { amount: 9, currency: "USD" });
        document.getElementById("ok").hidden = false;
      });
    };
    document.head.appendChild(s);
  })();
  </script>
</body>
</html>
